name: HYPERION Production CI/CD & Invariant Gate

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  GOFLAGS: "-mod=readonly"

jobs:
  # ============================================================================
  # 1. CONTRACT, INVARIANT & HELM SECURITY GATE
  # ============================================================================
  contracts-and-governance:
    name: Contracts, Fixed-Point Invariant & K8s Helm Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Setup Buf CLI
        uses: bufbuild/buf-setup-action@v1

      - name: Lint & Build Protobuf v3 Schemas
        run: |
          buf lint proto
          buf build proto -o /tmp/hyperion_descriptor.binpb

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Strict Lint & Render Production Kubernetes Helm Chart
        run: |
          helm lint deploy/helm/hyperion --strict
          helm template hyperion-prod deploy/helm/hyperion > /tmp/k8s-rendered.yaml
          grep -q "kind: HorizontalPodAutoscaler" /tmp/k8s-rendered.yaml
          grep -q "kind: NetworkPolicy" /tmp/k8s-rendered.yaml
          grep -q "kind: PodDisruptionBudget" /tmp/k8s-rendered.yaml

      - name: Verify Zero Floating-Point in Financial Proto & SQL Contracts
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          for p in glob.glob("proto/*.proto"):
              txt = open(p, encoding="utf-8").read()
              # Strip comments
              clean = re.sub(r"//.*", "", txt)
              if re.search(r"\b(float|double)\b", clean):
                  bad.append(p)
          for s in glob.glob("deploy/sql/*.sql"):
              txt = open(s, encoding="utf-8").read()
              clean = re.sub(r"--.*", "", txt)
              if re.search(r"\b(REAL|DOUBLE\s+PRECISION|FLOAT4|FLOAT8)\b", clean, re.I):
                  bad.append(s)
          if bad:
              print("FATAL: Floating-point types detected in financial contracts:", bad)
              sys.exit(1)
          print("OK: Zero floating-point types in /proto and /deploy/sql.")
          PY

  # ============================================================================
  # 2. RUST MATRIX (ledger-rs, stream-aggregator, chronos-replay)
  # ============================================================================
  rust-matrix:
    name: Rust (${{ matrix.service }}) — Clippy & Release Tests
    runs-on: ubuntu-latest
    needs: contracts-and-governance
    strategy:
      fail-fast: false
      matrix:
        service:
          - contracts/gen/rust
          - services/ledger-rs
          - services/stream-aggregator
          - services/chronos-replay
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Install System Build Dependencies (Protobuf & CMake)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.service }}

      - name: Format Check
        working-directory: ${{ matrix.service }}
        run: cargo fmt --all -- --check

      - name: Clippy Strict Lint (-D warnings)
        working-directory: ${{ matrix.service }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit, Integration & Proptest Suite (Release)
        working-directory: ${{ matrix.service }}
        run: cargo test --release -- --nocapture

  # ============================================================================
  # 3. GO CONCURRENCY & RACE DETECTOR MATRIX (gateway-go, chaos-sim)
  # ============================================================================
  go-matrix:
    name: Go (${{ matrix.service }}) — Vet, Staticcheck & Race Detector
    runs-on: ubuntu-latest
    needs: contracts-and-governance
    strategy:
      fail-fast: false
      matrix:
        service:
          - contracts/gen/go
          - services/gateway-go
          - services/chaos-sim
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: "${{ matrix.service }}/go.sum"

      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Go Vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...

      - name: Staticcheck Analysis
        working-directory: ${{ matrix.service }}
        run: staticcheck ./...

      - name: Go Race Detector Test Suite
        working-directory: ${{ matrix.service }}
        env:
          CGO_ENABLED: "1"
        run: go test -race -v ./...

      - name: Build Production Binary
        if: matrix.service != 'contracts/gen/go'
        working-directory: ${{ matrix.service }}
        run: go build -trimpath -ldflags="-s -w" ./...

  # ============================================================================
  # 4. PYTHON 3.12 ML & FORENSICS GATE (sentinel-ml)
  # ============================================================================
  python-sentinel-ml:
    name: Python 3.12 (sentinel-ml) — Ruff, ONNX Verification & Pytest/Hypothesis
    runs-on: ubuntu-latest
    needs: contracts-and-governance
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies & Proto Bindings
        run: |
          python -m pip install --upgrade pip ruff pytest hypothesis
          if [ -f contracts/gen/python/pyproject.toml ]; then
            pip install -e contracts/gen/python
          fi
          if [ -f services/sentinel-ml/pyproject.toml ]; then
            pip install -e "services/sentinel-ml[dev]" || pip install -e services/sentinel-ml
          elif [ -f services/sentinel-ml/requirements.txt ]; then
            pip install -r services/sentinel-ml/requirements.txt
          fi

      - name: Ruff Static Analysis
        run: ruff check services/sentinel-ml

      - name: Pytest & Hypothesis Property Tests + ONNX Latency Check
        working-directory: services/sentinel-ml
        env:
          PYTHONPATH: ".:src:../../contracts/gen/python/src"
        run: pytest -v

  # ============================================================================
  # 5. TYPESCRIPT MATRIX (contracts/gen/ts, aegis-agent, terminal-web)
  # ============================================================================
  typescript-matrix:
    name: TypeScript (${{ matrix.target }}) — Strict Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    needs: contracts-and-governance
    strategy:
      fail-fast: false
      matrix:
        target:
          - contracts/gen/ts
          - services/aegis-agent
          - apps/terminal-web
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Shared @hyperion/contracts SDK
        working-directory: contracts/gen/ts
        run: |
          npm install
          npm run build --if-present

      - name: Install Dependencies
        if: matrix.target != 'contracts/gen/ts'
        working-directory: ${{ matrix.target }}
        run: npm install

      - name: Strict TypeScript Check (tsc --noEmit)
        working-directory: ${{ matrix.target }}
        run: npx tsc --noEmit

      - name: Lint Check
        working-directory: ${{ matrix.target }}
        run: npm run lint --if-present

      - name: Unit & Guardrail Tests
        working-directory: ${{ matrix.target }}
        run: |
          if [ "${{ matrix.target }}" = "apps/terminal-web" ]; then
            npm run test:unit
          else
            npm test --if-present
          fi

      - name: Production Build
        working-directory: ${{ matrix.target }}
        run: npm run build --if-present

  # ============================================================================
  # 6. DOCKER COMPOSE & MULTI-STAGE CONTAINER VALIDATION
  # ============================================================================
  container-orchestration-validate:
    name: Multi-Stage Docker Compose Config & Security Audit Gate
    runs-on: ubuntu-latest
    needs:
      - rust-matrix
      - go-matrix
      - python-sentinel-ml
      - typescript-matrix
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Validate docker-compose.infra.yml & docker-compose.full.yml
        run: |
          docker compose -f docker-compose.infra.yml config -q
          docker compose -f docker-compose.full.yml config -q

      - name: Run Crucible Core Unit Tests, 25-Mutant Gate & Doc Link Integrity
        run: |
          python3 -m unittest e2e/test_crucible_core.py -v
          python3 e2e/mutation_audit_ch10.py
          python3 scripts/check_links.py

      - name: Verify Portfolio Documentation & Security Audit Presence
        run: |
          test -s README.md
          test -s docs/SECURITY_AUDIT.md
          ls docs/adr/*.md | wc -l | grep -qE "^[5-9]"
