[package]
name = "hyperion-zk-verifier-wasm"
version = "0.1.0"
edition = "2021"
description = "Compact sub-5ms BN254 Groth16 & Poseidon/Blake3 MSST Solvency Verifier for Browser WebAssembly (Channel 13 -> Channel 20)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ark-ff = { version = "0.5", default-features = false, features = ["std"] }
ark-ec = { version = "0.5", default-features = false, features = ["std"] }
ark-bn254 = { version = "0.5", default-features = false, features = ["curve", "scalar_field", "std"] }
ark-serialize = { version = "0.5", default-features = false, features = ["derive", "std"] }
ark-groth16 = { version = "0.5", default-features = false, features = ["std"] }
ark-crypto-primitives = { version = "0.5", default-features = false, features = ["sponge", "std"] }
blake3 = { version = "1.5", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
