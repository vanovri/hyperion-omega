[workspace]
resolver = "2"
members = [
    "crates/hyperion-quant-abi",
    "crates/hyperion-quant-sdk",
    "crates/strategies/stat-arb-zscore",
    "crates/strategies/obi-sniper",
    "crates/strategies/delta-hedger",
    "crates/malware-bombs",
    "host",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Hyperion Runtime & Compiler Systems Team"]

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = false
