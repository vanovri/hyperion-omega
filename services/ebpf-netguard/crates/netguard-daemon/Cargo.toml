[package]
name = "netguard-daemon"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "HYPERION Channel 16 eBPF/XDP Control Daemon, Userspace BPF Packet-VM, HDR Socket Histograms & Aegis Integration"

[[bin]]
name = "ebpf-netguard"
path = "src/main.rs"

[[bench]]
name = "xdp_pps_bench"
harness = false

[dependencies]
netguard-common = { path = "../netguard-common" }
netguard-ebpf = { path = "../netguard-ebpf" }
hyperion-proto = { path = "../../../../contracts/gen/rust" }
axum = "0.7"
blake3 = "1.5"
bytes = "1.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.12", features = ["transport", "gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
prost-build = "0.13"
tonic-build = "0.12"

[dev-dependencies]
proptest = "1.5"
rand_core = { version = "0.6", features = ["getrandom"] }
