[package]
name = "hyperion-stream-aggregator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "HYPERION Channel 04: High-Throughput Exactly-Once Quantitative Market Microstructure & TimescaleDB Stream Aggregator"

[lib]
name = "hyperion_stream_aggregator"
path = "src/lib.rs"

[[bin]]
name = "stream-aggregator"
path = "src/main.rs"

[[bench]]
name = "throughput_bench"
harness = false

[dependencies]
hyperion-proto = { path = "../../contracts/gen/rust" }
anyhow = "1.0"
axum = { version = "0.7", features = ["json"] }
bincode = "1.3"
blake3 = "1.5"
bytes = "1.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
crc32c = "0.6"
futures-util = "0.3"
hex = "0.4"
parking_lot = "0.12"
postgres-types = { version = "0.2", features = ["derive", "with-chrono-0_4", "with-serde_json-1"] }
prost = "0.13"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
rskafka = { version = "0.5", default-features = false }
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tonic = { version = "0.12", features = ["transport", "gzip"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
