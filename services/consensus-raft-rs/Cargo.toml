[package]
name = "consensus-raft-rs"
version = "0.1.0"
edition = "2021"
description = "HYPERION CH12 — 5-Node Hardened Raft Consensus Engine from Scratch + Blake3 WAL/Snapshot + TigerBeetle-Style VOPR DST + WGL Linearizability & Strict Serializability Verifier"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
axum = "0.7"
blake3 = "1.5"
crc32c = "0.6"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
proptest = "1.5"
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "raft_throughput"
harness = false
