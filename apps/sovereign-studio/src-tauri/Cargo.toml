[package]
name = "hyperion-sovereign-studio-desktop"
version = "2.0.0"
description = "HYPERION OMEGA Channel 20 — Native Rust Tauri v2 Multi-Window Sovereign Workstation"
authors = ["HYPERION OMEGA Systems Engineering"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hyperion_sovereign_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
