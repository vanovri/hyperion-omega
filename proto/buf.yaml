version: v2
modules:
  - path: .
    name: buf.build/hyperion/contracts
lint:
  use:
    - STANDARD
  except:
    # Prompt mandates flat /proto/*.proto layout and exact domain message names
    # (e.g. TimelineForkRequest -> StateTreeDiffResponse, ReplayFrameStream).
    - PACKAGE_DIRECTORY_MATCH
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
