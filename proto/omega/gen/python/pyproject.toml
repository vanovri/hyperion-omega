[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperion-omega-proto"
version = "0.2.0"
description = "Canonical Protobuf v3 & gRPC bindings for HYPERION OMEGA (Channels 11-20)"
requires-python = ">=3.11"
dependencies = [
    "protobuf>=5.28.0",
    "grpcio>=1.68.0",
]

[tool.setuptools.packages.find]
where = ["src"]
