syntax = "proto3";

package hyperion.omega.v1;

import "common.proto";

option go_package = "github.com/vanovri/hyperion/proto/omega/gen/go/omegav1;omegav1";

// Option contract payoff right.
enum OptionRight {
  OPTION_RIGHT_UNSPECIFIED = 0;
  OPTION_RIGHT_CALL = 1;
  OPTION_RIGHT_PUT = 2;
}

// Option exercise style supported by the institutional derivatives engine.
enum OptionExerciseStyle {
  OPTION_EXERCISE_STYLE_UNSPECIFIED = 0;
  OPTION_EXERCISE_STYLE_EUROPEAN = 1;
  OPTION_EXERCISE_STYLE_AMERICAN = 2;
}

// Portfolio-level cross-margin health classification.
enum MarginHealthStatus {
  MARGIN_HEALTH_STATUS_UNSPECIFIED = 0;
  MARGIN_HEALTH_STATUS_HEALTHY = 1;
  MARGIN_HEALTH_STATUS_INITIAL_MARGIN_BREACH = 2;
  MARGIN_HEALTH_STATUS_MAINTENANCE_BREACH_LIQUIDATABLE = 3;
  MARGIN_HEALTH_STATUS_BANKRUPT_DEFICIT = 4;
}

// Deterministic stage inside the 4-tier non-bankruptcy liquidation waterfall.
enum LiquidationStage {
  LIQUIDATION_STAGE_UNSPECIFIED = 0;
  LIQUIDATION_STAGE_CANCEL_OPEN_MARGIN_ORDERS = 1;
  LIQUIDATION_STAGE_PARTIAL_BOOK_LIQUIDATION = 2;
  LIQUIDATION_STAGE_INSURANCE_FUND_ABSORPTION = 3;
  LIQUIDATION_STAGE_AUTO_DELEVERAGING_ADL = 4;
}

// Single evaluated point inside the 16-point SPAN underlying-price x implied-vol shock grid.
message SpanScenarioPoint {
  uint32 scenario_id = 1;
  // Underlying price shock in signed basis points (e.g., -1500 = -15.00%, +1500 = +15.00%).
  int32 price_shock_bps = 2;
  // Implied volatility relative shock in signed basis points (e.g., -3000 = -30%, +3000 = +30%).
  int32 vol_shock_bps = 3;
  // Simulated portfolio PnL under this scenario in signed 128-bit fixed-point (scale 1e8).
  hyperion.v1.I128 scenario_pnl_fp = 4;
}

// Per-instrument derivative position & mark-to-market risk contribution (all fixed-point 1e8).
message DerivativePositionRisk {
  uint32 instrument_id = 1;
  string symbol = 2;
  // Signed position quantity (scale 1e8; positive = long, negative = short).
  int64 signed_qty_fp = 3;
  uint64 avg_entry_price_fp = 4;
  uint64 mark_price_fp = 5;
  uint64 index_price_fp = 6;
  uint64 bankruptcy_price_fp = 7;
  hyperion.v1.I128 unrealized_pnl_fp = 8;
  // Signed perpetual funding rate in fixed-point (scale 1e8; 0 for spot/options).
  int64 funding_rate_fp = 9;
  int64 net_delta_fp = 10;
  int64 net_gamma_fp = 11;
  int64 net_vega_fp = 12;
}

// Real-time SPAN / Scenario-Grid Cross-Margin snapshot for an institutional trading account.
message PortfolioMarginSnapshot {
  uint64 account_id = 1;
  uint64 engine_seq = 2;
  string collateral_asset = 3;
  MarginHealthStatus health_status = 4;
  // Settled cash/collateral balance before unrealized PnL (scale 1e8).
  hyperion.v1.I128 collateral_balance_fp = 5;
  // Net unrealized mark-to-market PnL across perpetuals & options (scale 1e8).
  hyperion.v1.I128 unrealized_pnl_fp = 6;
  // Total dynamic account equity = collateral_balance_fp + unrealized_pnl_fp (scale 1e8).
  hyperion.v1.I128 net_equity_fp = 7;
  // Required Initial Margin across 16-point SPAN grid + liquidity add-ons (scale 1e8).
  hyperion.v1.U128 initial_margin_req_fp = 8;
  // Required Maintenance Margin threshold triggering Liquidation Waterfall (scale 1e8).
  hyperion.v1.U128 maintenance_margin_req_fp = 9;
  //Worst-case loss across the 16 SPAN scenarios (scale 1e8).
  hyperion.v1.U128 worst_span_loss_fp = 10;
  // Aggregate portfolio Greeks in signed fixed-point (scale 1e8).
  int64 portfolio_delta_fp = 11;
  int64 portfolio_gamma_fp = 12;
  int64 portfolio_vega_fp = 13;
  int64 portfolio_theta_fp = 14;
  int64 portfolio_rho_fp = 15;
  int64 portfolio_vanna_fp = 16;
  int64 portfolio_volga_fp = 17;
  // Effective leverage in parts-per-million (e.g., 10_000_000 = 10.0x).
  uint64 effective_leverage_ppm = 18;
  // Profit-leverage quantile score in [0, 1_000_000] ppm for ADL counterparty ranking.
  uint32 adl_quantile_ppm = 19;
  repeated DerivativePositionRisk positions = 20;
  repeated SpanScenarioPoint span_grid = 21;
  uint64 computed_ts_ns = 22;
  hyperion.v1.TraceMetadata trace = 23;
}

// Arbitrage-free SVI (Stochastic Volatility Inspired) slice parameters for one expiry T:
//   w(k) = a + b * (rho * (k - m) + sqrt((k - m)^2 + sigma^2)), all scaled by 1e8.
message SviExpirySlice {
  uint64 expiry_ts_ns = 1;
  uint64 time_to_expiry_sec = 2;
  uint64 forward_price_fp = 3;
  int64 svi_a_fp = 4;
  uint64 svi_b_fp = 5;
  // Correlation parameter rho in (-1e8, +1e8).
  int64 svi_rho_fp = 6;
  int64 svi_m_fp = 7;
  uint64 svi_sigma_fp = 8;
  bool butterfly_arbitrage_free = 9;
  bool calendar_arbitrage_free = 10;
}

// Analytical 1st- and 2nd-order Greeks & converged Implied Volatility for a single option contract.
message OptionGreeksPoint {
  uint32 instrument_id = 1;
  string option_symbol = 2;
  OptionRight right = 3;
  OptionExerciseStyle style = 4;
  uint64 expiry_ts_ns = 5;
  uint64 strike_price_fp = 6;
  uint64 underlying_mark_fp = 7;
  uint64 option_mark_price_fp = 8;
  // Annualized Implied Volatility converged to <= 1e-8 (scale 1e8; 65_000_000 = 65.00%).
  uint64 implied_vol_fp = 9;
  uint32 solver_iterations = 10;
  // 1st- and 2nd-order analytical Greeks quantized to signed fixed-point (scale 1e8).
  int64 delta_fp = 11;
  int64 gamma_fp = 12;
  int64 vega_fp = 13;
  int64 theta_fp = 14;
  int64 rho_fp = 15;
  int64 vanna_fp = 16;
  int64 volga_fp = 17;
}

// Complete arbitrage-free Implied Volatility & analytical Greeks surface for an underlying asset.
message OptionGreeksSurface {
  string underlying_symbol = 1;
  uint64 engine_seq = 2;
  uint64 spot_index_price_fp = 3;
  int64 risk_free_rate_fp = 4;
  repeated SviExpirySlice svi_slices = 5;
  repeated OptionGreeksPoint points = 6;
  bool surface_arbitrage_free = 7;
  uint64 evaluation_latency_us = 8;
  uint64 ts_ns = 9;
  hyperion.v1.TraceMetadata trace = 10;
}

// Immutable audit event emitted at each step of the 4-stage Multi-Stage Liquidation Waterfall.
message LiquidationWaterfallEvent {
  string liquidation_id = 1;
  uint64 engine_seq = 2;
  uint64 account_id = 3;
  string symbol = 4;
  LiquidationStage stage = 5;
  uint64 mark_price_fp = 6;
  uint64 bankruptcy_price_fp = 7;
  uint64 execution_limit_price_fp = 8;
  uint64 liquidated_qty_fp = 9;
  uint32 canceled_open_orders = 10;
  hyperion.v1.I128 equity_before_fp = 11;
  hyperion.v1.U128 maintenance_margin_fp = 12;
  // Insurance fund delta in signed 128-bit fixed-point (positive = surplus captured, negative = deficit absorbed).
  hyperion.v1.I128 insurance_fund_delta_fp = 13;
  hyperion.v1.U128 insurance_fund_after_fp = 14;
  // Residual unabsorbed bankruptcy deficit requiring Stage 4 ADL (scale 1e8; 0 if absorbed).
  hyperion.v1.U128 residual_deficit_fp = 15;
  uint64 ts_ns = 16;
  hyperion.v1.TraceMetadata trace = 17;
}

// Counterparty leg selected by profit-leverage quantile ranking during Stage 4 Auto-Deleveraging.
message ADLCounterpartyAllocation {
  uint64 counterparty_account_id = 1;
  uint32 quantile_rank_ppm = 2;
  // Profit-leverage ranking score (scale 1e8).
  uint64 ranking_score_fp = 3;
  uint64 deleveraged_qty_fp = 4;
  // Executed at bankrupt account's bankruptcy_price_fp so zero system deficit leaks.
  uint64 settlement_price_fp = 5;
  hyperion.v1.I128 realized_pnl_settled_fp = 6;
}

// Stage-4 Auto-Deleveraging (ADL) trigger emitted when residual deficit exceeds Insurance Fund capacity.
message ADLTrigger {
  string adl_id = 1;
  string source_liquidation_id = 2;
  uint64 engine_seq = 3;
  uint64 bankrupt_account_id = 4;
  string symbol = 5;
  hyperion.v1.OrderSide bankrupt_position_side = 6;
  uint64 mark_price_fp = 7;
  uint64 bankruptcy_price_fp = 8;
  hyperion.v1.U128 uncovered_deficit_fp = 9;
  uint64 total_adl_qty_fp = 10;
  repeated ADLCounterpartyAllocation allocations = 11;
  // True iff post-ADL aggregate system equity + Insurance Fund >= 0 with zero leaked bad debt.
  bool system_solvency_preserved = 12;
  uint64 triggered_ts_ns = 13;
  hyperion.v1.TraceMetadata trace = 14;
}

message GetPortfolioMarginRequest {
  uint64 account_id = 1;
}

message GetOptionGreeksSurfaceRequest {
  string underlying_symbol = 1;
}

message StreamMarginEventsRequest {
  string symbol = 1;
  bool include_liquidations = 2;
  bool include_adl_triggers = 3;
}

message MarginEventEnvelope {
  uint64 engine_seq = 1;
  uint64 ts_ns = 2;
  oneof event {
    PortfolioMarginSnapshot margin_snapshot = 3;
    OptionGreeksSurface greeks_surface = 4;
    LiquidationWaterfallEvent liquidation = 5;
    ADLTrigger adl_trigger = 6;
  }
}

// Primary gRPC interface exposed by services/margin-risk-rs on port 50163.
service MarginRiskService {
  rpc GetPortfolioMargin(GetPortfolioMarginRequest) returns (PortfolioMarginSnapshot);
  rpc GetOptionGreeksSurface(GetOptionGreeksSurfaceRequest) returns (OptionGreeksSurface);
  rpc StreamMarginEvents(StreamMarginEventsRequest) returns (stream MarginEventEnvelope);
}
