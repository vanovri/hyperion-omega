{{- if and .Values.secrets.create (not .Values.secrets.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hyperion.secretName" . }}
  labels:
    {{- include "hyperion.labels" . | nindent 4 }}
type: Opaque
stringData:
  HYPERION_JWT_SECRET: {{ .Values.secrets.jwtVerifySecret | quote }}
  HYPERION_BOOTSTRAP_HMAC_SECRET: {{ .Values.secrets.hmacSigningKey | quote }}
  AEGIS_HMAC_SECRET: {{ .Values.secrets.hmacSigningKey | quote }}
  HYPERION_AEGIS_ED25519_PUB_HEX: {{ .Values.secrets.aegisEd25519PublicKeyHex | quote }}
  HYPERION_INTERNAL_AUTH_TOKEN: {{ .Values.secrets.internalAuthToken | default "replace-via-external-secrets-operator" | quote }}
  DATABASE_URL: {{ .Values.secrets.timescaleDsn | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hyperion.fullname" . }}-config
  labels:
    {{- include "hyperion.labels" . | nindent 4 }}
data:
  HYPERION_ENV: {{ .Values.global.environment | quote }}
  REDPANDA_BROKERS: {{ .Values.global.redpandaBrokers | quote }}
  HYPERION_REDPANDA_BROKERS: {{ .Values.global.redpandaBrokers | quote }}
  REDIS_ADDR: {{ .Values.global.redisAddr | quote }}
  REDIS_URL: "redis://{{ .Values.global.redisAddr }}/0"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.global.otelCollectorEndpoint | quote }}
  HYPERION_LEDGER_GRPC_ADDR: "0.0.0.0:50151"
  HYPERION_LEDGER_METRICS_PORT: "8082"
  HYPERION_AGGREGATOR_GRPC_ADDR: "0.0.0.0:50152"
  HYPERION_AGGREGATOR_HTTP_ADDR: "0.0.0.0:8083"
  SENTINEL_GRPC_PORT: "50153"
  SENTINEL_HTTP_PORT: "8084"
  HYPERION_AEGIS_AGENT_HTTP_PORT: "8085"
  HYPERION_CHRONOS_REPLAY_GRPC_ADDR: "0.0.0.0:50154"
  HYPERION_CHRONOS_REPLAY_HTTP_PORT: "8088"
  GATEWAY_PUBLIC_ADDR: ":8080"
  GATEWAY_ADMIN_ADDR: ":8081"
  LEDGER_GRPC_ADDRS: "{{ include "hyperion.fullname" . }}-ledger-rs:50151"
  ANALYTICS_GRPC_ADDRS: "{{ include "hyperion.fullname" . }}-stream-aggregator:50152"
  FRAUD_GRPC_ADDRS: "{{ include "hyperion.fullname" . }}-sentinel-ml:50153"
  CHRONOS_GRPC_ADDRS: "{{ include "hyperion.fullname" . }}-chronos-replay:50154"
  CHAOS_SIM_HTTP_URL: "http://{{ include "hyperion.fullname" . }}-chaos-sim:8086"
  HYPERION_GATEWAY_URL: "http://{{ include "hyperion.fullname" . }}-gateway-go:8080"
  HYPERION_GATEWAY_METRICS_URL: "http://{{ include "hyperion.fullname" . }}-gateway-go:8081"
  HYPERION_LEDGER_METRICS_URL: "http://{{ include "hyperion.fullname" . }}-ledger-rs:8082"
  HYPERION_STREAM_AGGREGATOR_URL: "http://{{ include "hyperion.fullname" . }}-stream-aggregator:8083"
  HYPERION_SENTINEL_ML_URL: "http://{{ include "hyperion.fullname" . }}-sentinel-ml:8084"
  HYPERION_CHAOS_SIM_URL: "http://{{ include "hyperion.fullname" . }}-chaos-sim:8086"
  HYPERION_CHRONOS_REPLAY_URL: "http://{{ include "hyperion.fullname" . }}-chronos-replay:8088"
  HYPERION_LEDGER_GRPC: "{{ include "hyperion.fullname" . }}-ledger-rs:50151"
