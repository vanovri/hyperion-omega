{{- if .Values.core.sovereignStudio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-studio
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: sovereign-studio
    hyperion.omega/channel: "20"
spec:
  replicas: {{ .Values.core.sovereignStudio.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sovereign-studio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovereign-studio
        hyperion.omega/channel: "20"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: sovereign-studio
          image: "{{ .Values.global.imageRegistry }}/sovereign-studio:{{ .Values.global.imageTag }}"
          ports:
            - name: http
              containerPort: {{ .Values.core.sovereignStudio.httpPort }}
          env:
            - name: PORT
              value: "{{ .Values.core.sovereignStudio.httpPort }}"
          resources:
            limits:
              memory: {{ .Values.core.sovereignStudio.memoryLimit }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sovereign-studio
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app.kubernetes.io/name: sovereign-studio
  ports:
    - name: http
      port: {{ .Values.core.sovereignStudio.httpPort }}
      targetPort: http
{{- end }}

{{- if .Values.omegaExpansion.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consensus-raft-rs
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: consensus-raft-rs
    hyperion.omega/channel: "12"
spec:
  serviceName: consensus-raft-headless
  replicas: {{ .Values.omegaExpansion.consensusRaft.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: consensus-raft-rs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consensus-raft-rs
        hyperion.omega/channel: "12"
    spec:
      containers:
        - name: consensus-raft-rs
          image: "{{ .Values.global.imageRegistry }}/consensus-raft-rs:{{ .Values.global.imageTag }}"
          ports:
            - name: grpc
              containerPort: {{ .Values.omegaExpansion.consensusRaft.grpcPort }}
            - name: http
              containerPort: {{ .Values.omegaExpansion.consensusRaft.httpPort }}
            - name: raft-peer
              containerPort: 50201
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: consensus-raft-pdb
  namespace: {{ .Values.global.namespace }}
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: consensus-raft-rs
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-netguard
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: ebpf-netguard
    hyperion.omega/channel: "16"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ebpf-netguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebpf-netguard
        hyperion.omega/channel: "16"
    spec:
      containers:
        - name: ebpf-netguard
          image: "{{ .Values.global.imageRegistry }}/ebpf-netguard:{{ .Values.global.imageTag }}"
          securityContext:
            capabilities:
              add: ["BPF", "NET_ADMIN"]
          ports:
            - name: grpc
              containerPort: {{ .Values.omegaExpansion.ebpfNetguard.grpcPort }}
            - name: http
              containerPort: {{ .Values.omegaExpansion.ebpfNetguard.httpPort }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-go-hpa
  namespace: {{ .Values.global.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-go
  minReplicas: {{ .Values.core.gatewayGo.minReplicas }}
  maxReplicas: {{ .Values.core.gatewayGo.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}
