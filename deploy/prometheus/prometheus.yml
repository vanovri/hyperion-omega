global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: hyperion-local
    mesh: deterministic-exchange

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888", "otel-collector:8889"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: hyperion-microservices-docker
    metrics_path: /metrics
    static_configs:
      - targets:
          - "gateway-go:8081"
          - "ledger-rs:8082"
          - "stream-aggregator:8083"
          - "sentinel-ml:8084"
          - "aegis-agent:8085"
          - "chaos-sim:8086"
          - "chronos-replay:8088"

  - job_name: hyperion-microservices-host
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8081" # gateway-go
          - "host.docker.internal:8082" # ledger-rs
          - "host.docker.internal:8083" # stream-aggregator
          - "host.docker.internal:8084" # sentinel-ml
          - "host.docker.internal:8085" # aegis-agent
          - "host.docker.internal:8086" # chaos-sim
          - "host.docker.internal:8088" # chronos-replay
